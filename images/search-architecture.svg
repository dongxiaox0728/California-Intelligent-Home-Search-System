<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="850" viewBox="0 0 1160 850" role="img" aria-labelledby="title description">
  <title id="title">CA Home Search architecture</title>
  <desc id="description">The React frontend sends the query to FastAPI on Render. After the compliance check, the selected mode runs either hybrid retrieval or BM25 keyword search. Hybrid retrieval parses the query, filters listings in TiDB, and ranks by structured preferences, FAISS similarity, both with equal weights, or newest first. BM25 ranks cleaned listing remarks independently. Selected listings are summarized and annotated before display. Redis optionally caches search responses, and the intent classifier supplies the search goal shown on the results page.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#5e776e"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #18342e; }
    .heading { font-size: 33px; font-weight: 700; }
    .section { font-size: 24px; font-weight: 700; }
    .step { font-size: 19px; font-weight: 650; }
    .detail { font-size: 16px; fill: #3f5951; }
    .route { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; fill: #3f5951; }
    .box { fill: #ffffff; stroke: #c6d9d0; }
    .flow { fill: none; stroke: #5e776e; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect x="0.5" y="0.5" width="1159" height="849" rx="20" fill="#f9fbf9" stroke="#d8e4de"/>
  <text class="heading" x="580" y="52" text-anchor="middle">CA Home Search architecture</text>

  <rect class="box" x="388" y="78" width="384" height="70" rx="14"/>
  <text class="step" x="580" y="108" text-anchor="middle">React / Vite frontend · Vercel</text>
  <text class="detail" x="580" y="132" text-anchor="middle">Query, search mode, and sidebar refinements</text>
  <path class="flow" d="M580 148V176"/>

  <rect x="380" y="176" width="400" height="77" rx="14" fill="#e4f1eb" stroke="#a5c7b7"/>
  <text class="step" x="580" y="207" text-anchor="middle">FastAPI backend · Render</text>
  <text class="detail" x="580" y="232" text-anchor="middle">Compliance check before retrieval</text>
  <rect class="box" x="48" y="182" width="272" height="65" rx="12"/>
  <text class="step" x="184" y="210" text-anchor="middle">Intent classifier</text>
  <text class="detail" x="184" y="231" text-anchor="middle">Provides the displayed search goal</text>
  <rect class="box" x="840" y="182" width="272" height="65" rx="12"/>
  <text class="step" x="976" y="210" text-anchor="middle">Redis</text>
  <text class="detail" x="976" y="231" text-anchor="middle">Optional cache for recent responses</text>
  <path d="M320 214H380M780 214H840" stroke="#748c82" stroke-width="2" stroke-dasharray="4 5"/>

  <path class="flow" d="M580 253V273H384V301"/>
  <path class="flow" d="M580 253V273H937V301"/>
  <rect x="48" y="301" width="672" height="372" rx="17" fill="#e9f4ed" stroke="#b2d0bf"/>
  <text class="section" x="72" y="338">Hybrid retrieval · Smart Search</text>
  <text class="route" x="696" y="338" text-anchor="end">POST /search</text>

  <rect class="box" x="72" y="356" width="624" height="65" rx="10"/>
  <text class="step" x="88" y="384">Parse the query and apply refinements</text>
  <text class="detail" x="88" y="405">Hard filters, soft numeric preferences, and descriptive text</text>
  <path class="flow" d="M384 421V441"/>
  <rect class="box" x="72" y="441" width="624" height="65" rx="10"/>
  <text class="step" x="88" y="469">Filter listings in TiDB</text>
  <text class="detail" x="88" y="490">SQL applies hard requirements to determine eligibility</text>
  <path class="flow" d="M384 506V526"/>
  <rect class="box" x="72" y="526" width="624" height="123" rx="10"/>
  <text class="step" x="88" y="555">Rank the eligible listings</text>
  <text class="detail" x="88" y="579">Numeric preferences → structured scores</text>
  <text class="detail" x="88" y="600">Descriptive preferences → similarity from the prebuilt FAISS index</text>
  <text class="detail" x="88" y="621">Both signals → equal weights · No preferences → newest first</text>

  <rect x="762" y="301" width="350" height="372" rx="17" fill="#f9f0e5" stroke="#dec6ac"/>
  <text class="section" x="786" y="338">BM25 keyword search</text>
  <text class="route" x="786" y="363">POST /bm25-search</text>
  <rect class="box" x="786" y="400" width="302" height="72" rx="10"/>
  <text class="step" x="802" y="431">Cleaned listing remarks</text>
  <text class="detail" x="802" y="453">Source for the BM25 index</text>
  <path class="flow" d="M937 472V502"/>
  <rect class="box" x="786" y="502" width="302" height="72" rx="10"/>
  <text class="step" x="802" y="533">Rank by keyword relevance</text>
  <text class="detail" x="802" y="555">Match the terms in the query</text>

  <path class="flow" d="M384 673V702H580V729"/>
  <path d="M937 673V702H580" fill="none" stroke="#5e776e" stroke-width="2"/>
  <rect class="box" x="295" y="729" width="570" height="84" rx="14"/>
  <text class="step" x="580" y="762" text-anchor="middle">Result enrichment and listing cards</text>
  <text class="detail" x="580" y="788" text-anchor="middle">Summarize remarks and extract property signals for display</text>
</svg>
